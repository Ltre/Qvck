<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>灵感速记 · 手机版</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#f5f5f8;color:#20212b}button,input,textarea{font:inherit}button{border:0;border-radius:13px;padding:12px 14px;background:#292943;color:#fff;cursor:pointer}button:disabled{opacity:.4}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#fff;border-bottom:1px solid #eee}header strong{font-size:20px}header small{font-size:12px;color:#777}.shell{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}.viewport{flex:1;min-height:0;overflow:hidden;touch-action:pan-y}.track{height:100%;display:flex;transition:transform .24s ease;will-change:transform}.page{flex:0 0 100%;width:100%;height:100%;min-height:0;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}.page h2{font-size:19px;margin:2px 0}.hint{font-size:12px;color:#747487;line-height:1.5}.field{width:100%;border:1px solid #dddfe8;border-radius:13px;padding:12px;background:white;outline:none}textarea{resize:none;flex:1;min-height:80px}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;min-width:0}.panel{background:white;border-radius:16px;padding:12px}.grow{flex:1;min-height:0;display:flex;flex-direction:column}canvas{width:100%;height:100%;background:#fff;border:1px solid #ddd;border-radius:14px;touch-action:none;display:block}.canvaswrap{flex:1;min-height:0}audio{width:100%;max-height:44px}#items{overflow-y:auto;min-height:0;flex:1}article{border-bottom:1px solid #e6e6ec;padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}article h3{margin:0 0 6px}article p{margin:8px 0}article img{max-width:100%}.bottom{height:65px;flex-shrink:0;display:grid;grid-template-columns:repeat(3,1fr);background:white;border-top:1px solid #e8e8ef}.tab{background:transparent;color:#777;border-radius:0;padding:7px;font-size:12px}.tab span{display:block;font-size:21px}.tab.active{color:#5148d8;font-weight:700}.primary{background:#5148d8}.status{min-height:36px}#import{max-width:100%;font-size:12px}.tools{flex-shrink:0}body{overscroll-behavior:none}@media(min-width:700px){.shell{max-width:650px;margin:auto;box-shadow:0 0 40px #ddd}.page{padding:24px}}
</style></head><body><div class="shell"><header><strong>💡 灵感速记</strong><small>左右滑动切换</small></header><div class="viewport" id="viewport"><div class="track" id="track">
<section class="page"><h2>🎙 快速捕捉</h2><input class="field" id="title" placeholder="给灵感起个名字（可选）"><div class="row"><button id="record">开始录音</button><button id="stop" disabled>停止</button><button id="speech">语音转文字</button></div><div class="row"><button id="cloud">备用云转写</button><label class="hint">导入音频 <input type="file" id="audioFile" accept="audio/*" style="max-width:145px"></label></div><div class="status hint" id="status">录音和语音识别需要浏览器麦克风权限。</div><audio id="play" controls hidden></audio><textarea class="field" id="note" placeholder="想到什么，就写下来或说出来……"></textarea><div class="row tools"><button class="primary" id="quickSave">保存灵感</button><button id="goDraw">去画板 →</button></div></section>
<section class="page"><h2>✏️ 自由画板</h2><div class="hint">可以一边录音一边画；切换页面不会停止录音。</div><div class="canvaswrap"><canvas id="board"></canvas></div><div class="row tools"><button id="clear">清空画布</button><button class="primary" id="save">保存这条灵感</button></div></section>
<section class="page"><h2>📚 灵感记录</h2><input class="field" id="search" placeholder="搜索标题和文字"><div id="items"></div><div class="hint">记录存储在当前浏览器，建议定期备份。</div><div class="row tools"><button id="export">导出 JSON</button><label class="panel" style="flex:1;text-align:center">导入 JSON<input type="file" id="import" accept="application/json"></label></div></section>
</div></div><nav class="bottom"><button class="tab active" data-tab="0"><span>🎙</span>速记</button><button class="tab" data-tab="1"><span>✏️</span>画板</button><button class="tab" data-tab="2"><span>📚</span>记录</button></nav></div><script>
const $=id=>document.getElementById(id),canvas=$('board'),ctx=canvas.getContext('2d');let drawing=false,recorder,chunks=[],audioData='',stream;function resize(){let previous=canvas.toDataURL();canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=3;ctx.lineCap='round';if(previous&&previous!=='data:,'){let im=new Image;im.onload=()=>ctx.drawImage(im,0,0,canvas.clientWidth,canvas.clientHeight);im.src=previous}}resize();function point(e){let r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e))};canvas.onpointermove=e=>{if(drawing){ctx.lineTo(...point(e));ctx.stroke()}};canvas.onpointerup=()=>drawing=false;$('clear').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);$('record').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{let blob=new Blob(chunks,{type:recorder.mimeType});let reader=new FileReader;reader.onload=()=>{audioData=reader.result;$('play').src=audioData;$('play').hidden=false};reader.readAsDataURL(blob);stream.getTracks().forEach(t=>t.stop())};recorder.start();$('record').disabled=true;$('stop').disabled=false;$('status').textContent='正在录音，可以同时写字和画画';}catch(e){alert('无法启动麦克风：'+e.message)}};$('stop').onclick=()=>{recorder.stop();$('record').disabled=false;$('stop').disabled=true;$('status').textContent='录音结束'};let activeSpeech=null;
function state(message){$('status').textContent=message}
function stopSpeech(){if(activeSpeech){activeSpeech.stop();activeSpeech=null}$('speech').textContent='语音转文字'}
$('speech').onclick=()=>{
 if(activeSpeech){stopSpeech();state('已手动停止识别，录音可继续保存');return}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){state('此浏览器没有语音识别接口。可继续录音，或使用备用云转写（需配置服务）。');return}
 try{
  const sr=new SR;activeSpeech=sr;sr.lang='zh-CN';sr.continuous=true;sr.interimResults=false;
  sr.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)$('note').value+=e.results[i][0].transcript+' '};
  sr.onerror=e=>{state('浏览器识别失败（'+e.error+'）。录音不受影响；可使用备用转写。')};
  sr.onend=()=>{if(activeSpeech===sr){activeSpeech=null;$('speech').textContent='语音转文字';if(!$('status').textContent.includes('失败'))state('浏览器语音识别已结束')}};
  sr.start();$('speech').textContent='停止识别';state('正在使用浏览器语音识别；可同时录音和绘画');
 }catch(e){activeSpeech=null;state('浏览器识别无法启动：'+e.message+'。可使用备用转写。')}
};
$('audioFile').onchange=async e=>{
 const f=e.target.files?.[0];if(!f)return;
 const reader=new FileReader();reader.onload=()=>{audioData=reader.result;$('play').src=audioData;$('play').hidden=false;state('音频已导入，可以保存；如需转写请配置备用服务。')};reader.readAsDataURL(f)
};
$('cloud').onclick=async()=>{
 if(!audioData){state('请先录音并停止，或导入音频文件。');return}
 const endpoint=localStorage.getItem('inspiration_transcribe_endpoint');
 if(!endpoint){const input=prompt('尚未配置备用转写服务。请输入你自己的 HTTPS 转写接口地址（留空则不发送录音）：');if(!input)return;
  try{let u=new URL(input);if(u.protocol!=='https:')throw Error();localStorage.setItem('inspiration_transcribe_endpoint',u.href)}catch{state('接口地址必须是 HTTPS');return}}
 const url=localStorage.getItem('inspiration_transcribe_endpoint');
 if(!confirm('即将把当前录音发送到你配置的转写服务：'+url+'。是否继续？'))return;
 try{state('正在请求备用转写服务……');const blob=await(await fetch(audioData)).blob();const form=new FormData();form.append('file',blob,'recording.webm');form.append('language','zh');
  const response=await fetch(url,{method:'POST',body:form});if(!response.ok)throw Error('HTTP '+response.status);
  const data=await response.json();if(typeof data.text!=='string')throw Error('接口未返回 text 字段');$('note').value+=($('note').value?'\n':'')+data.text;state('备用转写成功，文字已加入笔记')
 }catch(e){state('备用转写失败：'+e.message+'。录音仍可保存；接口需支持 CORS，并返回 JSON {text:"..."}。')}
};const KEY='inspiration_records_v1';function get(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}function set(v){localStorage.setItem(KEY,JSON.stringify(v))}function render(){let q=$('search').value.toLowerCase();$('items').replaceChildren();get().filter(x=>(x.title+x.note).toLowerCase().includes(q)).forEach(x=>{let a=document.createElement('article'),h=document.createElement('h3'),t=document.createElement('small'),p=document.createElement('p'),img=document.createElement('img'),b=document.createElement('button');h.textContent=x.title||'未命名灵感';t.textContent=new Date(x.date).toLocaleString();p.textContent=x.note;a.append(h,t,p);if(x.drawing){img.src=x.drawing;img.style='max-width:100%;max-height:230px';a.append(img)}if(x.audio){let au=document.createElement('audio');au.controls=true;au.src=x.audio;a.append(au)}b.textContent='删除';b.onclick=()=>{if(confirm('确定删除？')){set(get().filter(y=>y.id!==x.id));render()}};a.append(b);$('items').append(a)})}$('save').onclick=()=>{if(recorder?.state==='recording'){alert('请先停止录音');return}let x={id:Date.now()+Math.random(),date:new Date().toISOString(),title:$('title').value,note:$('note').value,drawing:canvas.toDataURL('image/png'),audio:audioData};try{set([x,...get()]);$('title').value='';$('note').value='';audioData='';$('play').hidden=true;ctx.clearRect(0,0,canvas.width,canvas.height);render();alert('已保存到当前浏览器')}catch(e){alert('存储失败，可能是录音太大或浏览器空间不足。请导出旧记录备份。')}};$('search').oninput=render;$('export').onclick=()=>{let b=new Blob([JSON.stringify(get())],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='灵感速记备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v))throw Error('格式不正确');set([...v,...get()]);render();alert('导入成功')}catch(err){alert('导入失败：'+err.message)}};render();

let currentPage=0;function goPage(i){currentPage=Math.max(0,Math.min(2,i));document.getElementById('track').style.transform=`translateX(-${currentPage*100}%)`;document.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('active',j===currentPage));if(currentPage===1)requestAnimationFrame(resize)}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>goPage(Number(b.dataset.tab))));document.getElementById('goDraw').onclick=()=>goPage(1);document.getElementById('quickSave').onclick=()=>document.getElementById('save').click();let sx=0,sy=0;const vp=document.getElementById('viewport');vp.addEventListener('touchstart',e=>{if(e.target.closest('canvas,textarea,input,audio,#items')){sx=0;return}sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});vp.addEventListener('touchend',e=>{if(!sx)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4)goPage(currentPage+(dx<0?1:-1));sx=0},{passive:true});window.addEventListener('resize',()=>{if(currentPage===1)resize()});
</script></body></html>
