<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灵感速记</title><style>body{font-family:system-ui;background:#f6f6f8;color:#222;margin:0}main{max-width:780px;margin:auto;padding:20px}button,input,textarea{font:inherit}button{border:0;border-radius:12px;padding:12px;background:#272733;color:white;margin:4px;cursor:pointer}button:disabled{opacity:.4}textarea{box-sizing:border-box;width:100%;min-height:110px;border:1px solid #ddd;border-radius:12px;padding:12px}canvas{background:white;border:1px solid #ccc;border-radius:12px;width:100%;height:300px;touch-action:none}section{background:white;padding:16px;border-radius:18px;margin:14px 0}article{border-top:1px solid #eee;padding:12px 0;white-space:pre-wrap}small{color:#777}audio{max-width:100%}</style><main><h1>💡 灵感速记</h1><p>随时说、写、画。录音与草图可以一起记录。</p><section><h2>新灵感</h2><input id="title" placeholder="给灵感起个名字（可选）" style="width:95%;padding:10px"><p><button id="record">🎙 开始录音</button><button id="stop" disabled>停止录音</button><button id="speech">📝 语音转文字</button></p><small id="status">语音转文字依赖浏览器支持与麦克风权限，部分浏览器不支持。</small><p><audio id="play" controls hidden></audio></p><textarea id="note" placeholder="在这里写下想法，或使用语音转文字……"></textarea><h3>画出你的想法</h3><canvas id="board"></canvas><p><button id="clear">清空画布</button><button id="save">保存这条灵感</button></p></section><section><h2>灵感记录</h2><input id="search" placeholder="搜索标题和文字" style="padding:10px;width:90%"><div id="items"></div><small>记录保存在当前浏览器本地。录音较大时可能超出存储空间；请及时导出备份。</small><p><button id="export">导出全部记录 JSON</button><label style="display:inline-block;padding:12px">导入 JSON <input type="file" id="import" accept="application/json"></label></p></section></main><script>
const $=id=>document.getElementById(id),canvas=$('board'),ctx=canvas.getContext('2d');let drawing=false,recorder,chunks=[],audioData='',stream;function resize(){let previous=canvas.toDataURL();canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=300*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=3;ctx.lineCap='round';if(previous&&previous!=='data:,'){let im=new Image;im.onload=()=>ctx.drawImage(im,0,0,canvas.clientWidth,300);im.src=previous}}resize();function point(e){let r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e))};canvas.onpointermove=e=>{if(drawing){ctx.lineTo(...point(e));ctx.stroke()}};canvas.onpointerup=()=>drawing=false;$('clear').onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height);$('record').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{let blob=new Blob(chunks,{type:recorder.mimeType});let reader=new FileReader;reader.onload=()=>{audioData=reader.result;$('play').src=audioData;$('play').hidden=false};reader.readAsDataURL(blob);stream.getTracks().forEach(t=>t.stop())};recorder.start();$('record').disabled=true;$('stop').disabled=false;$('status').textContent='正在录音，可以同时写字和画画';}catch(e){alert('无法启动麦克风：'+e.message)}};$('stop').onclick=()=>{recorder.stop();$('record').disabled=false;$('stop').disabled=true;$('status').textContent='录音结束'};$('speech').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('当前浏览器不支持语音转文字，请改用支持该功能的浏览器，或手动输入。');return}let sr=new SR;sr.lang='zh-CN';sr.continuous=true;sr.interimResults=false;sr.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)$('note').value+=e.results[i][0].transcript+' '};sr.onerror=e=>$('status').textContent='识别失败：'+e.error;sr.onend=()=>$('status').textContent='语音识别已停止';sr.start();$('status').textContent='正在语音识别；停止可再次点击识别按钮';$('speech').onclick=()=>{sr.stop();$('speech').onclick=()=>location.reload()}};const KEY='inspiration_records_v1';function get(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}function set(v){localStorage.setItem(KEY,JSON.stringify(v))}function render(){let q=$('search').value.toLowerCase();$('items').replaceChildren();get().filter(x=>(x.title+x.note).toLowerCase().includes(q)).forEach(x=>{let a=document.createElement('article'),h=document.createElement('h3'),t=document.createElement('small'),p=document.createElement('p'),img=document.createElement('img'),b=document.createElement('button');h.textContent=x.title||'未命名灵感';t.textContent=new Date(x.date).toLocaleString();p.textContent=x.note;a.append(h,t,p);if(x.drawing){img.src=x.drawing;img.style='max-width:100%;max-height:230px';a.append(img)}if(x.audio){let au=document.createElement('audio');au.controls=true;au.src=x.audio;a.append(au)}b.textContent='删除';b.onclick=()=>{if(confirm('确定删除？')){set(get().filter(y=>y.id!==x.id));render()}};a.append(b);$('items').append(a)})}$('save').onclick=()=>{if(recorder?.state==='recording'){alert('请先停止录音');return}let x={id:Date.now()+Math.random(),date:new Date().toISOString(),title:$('title').value,note:$('note').value,drawing:canvas.toDataURL('image/png'),audio:audioData};try{set([x,...get()]);$('title').value='';$('note').value='';audioData='';$('play').hidden=true;ctx.clearRect(0,0,canvas.width,canvas.height);render();alert('已保存到当前浏览器')}catch(e){alert('存储失败，可能是录音太大或浏览器空间不足。请导出旧记录备份。')}};$('search').oninput=render;$('export').onclick=()=>{let b=new Blob([JSON.stringify(get())],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='灵感速记备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v))throw Error('格式不正确');set([...v,...get()]);render();alert('导入成功')}catch(err){alert('导入失败：'+err.message)}};render();
</script></html>
